<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>Snells Beach · where to go today</title>
<meta name="description" content="Daily beach pick around Snells Beach, Mahurangi: wind, swell, tide, dogs and drive time.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Snells Beach">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top wrap">
  <p class="sub" id="subtitle">Loading the forecast…</p>
  <h1 id="title">Where to go today</h1>
</header>

<form class="prefs wrap" id="prefs" aria-label="Your preferences" onsubmit="return false">
  <div class="pills" role="group" aria-label="Activities (pick any)" id="activity">
      <label class="pill"><input type="checkbox" name="activity" value="hangout"><span><svg class="ic" aria-hidden="true"><use href="#i-hangout"/></svg>Hangout</span></label>
      <label class="pill"><input type="checkbox" name="activity" value="swim"><span><svg class="ic" aria-hidden="true"><use href="#i-swim"/></svg>Swim</span></label>
      <label class="pill"><input type="checkbox" name="activity" value="surf"><span><svg class="ic" aria-hidden="true"><use href="#i-surf"/></svg>Surf</span></label>
      <label class="pill"><input type="checkbox" name="activity" value="snorkel"><span><svg class="ic" aria-hidden="true"><use href="#i-snorkel"/></svg>Snorkel</span></label>
      <label class="pill"><input type="checkbox" name="activity" value="sup"><span><svg class="ic" aria-hidden="true"><use href="#i-sup"/></svg>SUP/Kayak</span></label>
      <label class="pill"><input type="checkbox" name="activity" value="sailing"><span><svg class="ic" aria-hidden="true"><use href="#i-sail"/></svg>Sail</span></label>
      <label class="pill"><input type="checkbox" name="activity" value="fishing"><span><svg class="ic" aria-hidden="true"><use href="#i-fish"/></svg>Fish</span></label>
      <label class="pill"><input type="checkbox" name="activity" value="walking"><span><svg class="ic" aria-hidden="true"><use href="#i-walk"/></svg>Walk</span></label>
  </div>
  <div class="pills" role="group" aria-label="Drive and dog">
    <label class="pill"><input type="radio" name="drive" value="0"><span><svg class="ic" aria-hidden="true"><use href="#i-car"/></svg>Local ≤15 min</span></label>
    <label class="pill"><input type="radio" name="drive" value="1"><span>Nearby ≤35</span></label>
    <label class="pill"><input type="radio" name="drive" value="2"><span>Road trip</span></label>
    <label class="pill"><input type="checkbox" id="dog"><span><svg class="ic" aria-hidden="true"><use href="#i-dog"/></svg>Dog</span></label>
    <details class="favs pillish"><summary>★ Favourites <small id="favcount">none</small></summary><div id="favlist" class="favlist"></div></details>
  </div>
</form>

<main class="wrap" id="app" aria-live="polite">
  <div class="loading"><div class="spinner"></div>Checking wind, swell and tide…</div>
</main>

<footer class="wrap foot" id="foot"></footer>

<!-- icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 9c2.5-2 5-2 7.5 0s5 2 7.5 0 3.5-1.5 5-1M2 15c2.5-2 5-2 7.5 0s5 2 7.5 0 3.5-1.5 5-1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>

</html>
