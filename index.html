<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>Snells Beach · where to go today</title>
<meta name="description" content="Daily beach pick around Snells Beach, Mahurangi: wind, swell, tide, dogs and drive time.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='12' r='7' fill='%23ff8a3d'/%3E%3Cpath d='M0 22c4-3 8-3 12 0s8 3 12 0 6-3 8-2v12H0z' fill='%231b7f79'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="wrap">
    <p class="eyebrow">Snells Beach · Mahurangi</p>
    <h1 id="title">Where to go today</h1>
    <p class="sub" id="subtitle">Loading the forecast…</p>
  </div>
</header>

<form class="prefs" id="prefs" aria-label="Your preferences" onsubmit="return false">
  <div class="wrap prefs-inner">
    <div class="seg" role="radiogroup" aria-label="Activity" id="activity">
      <label><input type="radio" name="activity" value="swim"><span><svg class="ic"><use href="#i-swim"/></svg>Swim</span></label>
      <label><input type="radio" name="activity" value="surf"><span><svg class="ic"><use href="#i-surf"/></svg>Surf</span></label>
      <label><input type="radio" name="activity" value="snorkel"><span><svg class="ic"><use href="#i-snorkel"/></svg>Snorkel</span></label>
      <label><input type="radio" name="activity" value="sup"><span><svg class="ic"><use href="#i-sup"/></svg>SUP / Kayak</span></label>
    </div>
    <div class="row2">
      <div class="drive">
        <label for="drive" class="mini"><svg class="ic"><use href="#i-car"/></svg><span id="driveLabel">Local</span></label>
        <input type="range" id="drive" min="0" max="2" step="1" value="1" aria-describedby="driveHint">
        <div class="ticks" id="driveHint"><span>Local</span><span>Nearby</span><span>Road trip</span></div>
      </div>
      <label class="switch">
        <input type="checkbox" id="dog">
        <span class="track" aria-hidden="true"><span class="knob"></span></span>
        <span class="mini"><svg class="ic"><use href="#i-dog"/></svg>Dog</span>
      </label>
    </div>
  </div>
</form>

<main class="wrap" id="app" aria-live="polite">
  <div class="loading"><div class="spinner"></div>Checking wind, swell and tide…</div>
</main>

<footer class="wrap foot" id="foot"></footer>

<!-- icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-swim" viewBox="0 0 24 24"><circle cx="16.5" cy="6" r="2.2" fill="currentColor"/><path d="M4 12.5l5-3 3.5 2.5 3-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 17c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0 2 1 2 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-surf" viewBox="0 0 24 24"><path d="M2 18c3-1.6 5-1.6 8 0s5 1.6 8 0 3.4-1 4-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 14c1-6 6-10 12-9-3 1.5-4 4-2.5 6.5 1 1.6 3 2 4.5 1.5-1.5 2.5-5 3.6-8 2.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-snorkel" viewBox="0 0 24 24"><rect x="2.5" y="8" width="13" height="7.5" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 15.5v-2M19.5 3v11a4 4 0 0 1-4 4H12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-sup" viewBox="0 0 24 24"><path d="M2 17.5h20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="11" cy="5" r="2" fill="currentColor"/><path d="M11 7.5v6M8 15l3-1.5 3 1.5M17 3l-4 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="M4 16v-4l2-5h12l2 5v4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="7.5" cy="16.5" r="1.8" fill="currentColor"/><circle cx="16.5" cy="16.5" r="1.8" fill="currentColor"/><path d="M4 12h16" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-dog" viewBox="0 0 24 24"><path d="M5 20v-6l-2-3 2-5 3 2h6l3-2 2 5-2 3v6M9 20v-4h6v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="9.5" cy="11.5" r="1" fill="currentColor"/><circle cx="14.5" cy="11.5" r="1" fill="currentColor"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 9c2.5-2 5-2 7.5 0s5 2 7.5 0 3.5-1.5 5-1M2 15c2.5-2 5-2 7.5 0s5 2 7.5 0 3.5-1.5 5-1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-tide" viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5L12 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 19c2.5-1.8 5-1.8 7.5 0s5 1.8 7.5 0 3.5-1.4 5-.9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-traffic" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="7" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="17" r="1.8" fill="currentColor"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 21V4M5.5 10L12 3.5 18.5 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-partly" viewBox="0 0 24 24"><circle cx="9" cy="9" r="4" fill="currentColor" opacity=".55"/><path d="M7 19h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.6A3.2 3.2 0 0 0 7 19z" fill="currentColor"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M6 19h11a4.5 4.5 0 0 0 0-9 5.5 5.5 0 0 0-10.6 1.8A3.6 3.6 0 0 0 6 19z" fill="currentColor"/></symbol>
    <symbol id="i-rain" viewBox="0 0 24 24"><path d="M6 14h11a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.6A3.2 3.2 0 0 0 6 14z" fill="currentColor"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-temp" viewBox="0 0 24 24"><path d="M10 4a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="17" r="1.8" fill="currentColor"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor"/></symbol>
  </defs>
</svg>
<script src="app.js" defer></script>
</body>
</html>
